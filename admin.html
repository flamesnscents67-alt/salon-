<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><title>Owner Dashboard — Blush &amp; Bloom</title><meta name="robots" content="noindex"></head><body>
<section><div class="page" id="root"></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>layout("admin.html");const R=document.getElementById("root"),q=id=>document.getElementById(id);
async function start(){(await API.isAdmin())?dash():loginView()}
function loginView(){R.innerHTML='<h1>Owner login</h1><div class="panel" style="max-width:420px">'+(live?'<label for="em">Email</label><input id="em" type="email">':'<p class="note">Demo dashboard. Password: '+esc(C.demoAdminPassword)+'</p>')+'<label for="pw">Password</label><input id="pw" type="password"><p class="note" id="le" role="alert" style="color:#b3314f"></p><button class="btn" id="lb">Log in</button></div>';
 q("lb").onclick=async function(){const ok=await API.login(live?q("em").value:"",q("pw").value);ok?dash():q("le").textContent="Wrong email or password."}}
async function dash(tab){tab=tab||"svc";R.innerHTML='<h1>Dashboard</h1><div class="tabs"><button class="btn'+(tab==="svc"?"":" ghost")+'" id="t1">Services</button><button class="btn'+(tab==="bk"?"":" ghost")+'" id="t2">Bookings</button><button class="btn ghost" id="t3">Log out</button></div><div id="body"></div>';
 q("t1").onclick=function(){dash("svc")};q("t2").onclick=function(){dash("bk")};q("t3").onclick=async function(){await API.logout();loginView()};
 tab==="svc"?svcView():bkView()}
async function bkView(){const l=(await API.bookings()).sort(function(a,b){return (a.date+a.time).localeCompare(b.date+b.time)});q("body").innerHTML='<div class="panel" style="overflow:auto"><table><tr><th>When</th><th>Client</th><th>Services</th><th>Total</th></tr>'+(l.length?l.map(function(b){return '<tr><td>'+esc(b.date)+'<br>'+esc(String(b.time).slice(0,5))+'</td><td>'+esc(b.name)+'<br>'+esc(b.phone)+'<br>'+esc(b.email)+(b.notes?'<br><i>'+esc(b.notes)+'</i>':'')+'</td><td>'+esc((b.services||[]).join(", "))+'</td><td>'+money(b.total)+'</td></tr>'}).join(""):'<tr><td colspan="4">No bookings yet.</td></tr>')+'</table></div>'}
async function svcView(){const l=await API.services(true);
 q("body").innerHTML='<div class="panel"><p class="note">Tip: tap ★ Popular to show or hide a service in the Popular list on the home page. Tap Sale to set or end a sale price.</p><h3 id="ft">Add a service</h3><input type="hidden" id="id">'
 +'<div class="two"><div><label for="a">Name</label><input id="a"></div><div><label for="du">Duration (minutes)</label><input id="du" type="number" min="5" value="60"></div></div>'
 +'<label for="d">Description</label><input id="d">'
 +'<div class="two"><div><label for="pr">Price</label><input id="pr" type="number" min="0"></div><div><label for="sp">Sale price (empty = no sale)</label><input id="sp" type="number" min="0"></div></div>'
 +'<label for="up">Photo</label><div class="row2"><input type="file" id="up" accept="image/*" style="width:auto"><img id="pv" class="thumb" alt="" hidden></div>'
 +'<label for="im">…or paste an image link</label><input id="im">'
 +'<div class="row2"><label class="chk"><input type="checkbox" id="po">Popular on home page</label><label class="chk"><input type="checkbox" id="ac" checked>Shown on site</label></div>'
 +'<p class="note" id="se" role="alert" style="color:#b3314f"></p><div class="row2"><button class="btn" id="sv">Save service</button><button class="btn ghost" id="cl">Clear</button></div></div>'
 +'<div class="panel" style="overflow:auto"><table><tr><th></th><th>Service</th><th>Price</th><th>Status</th><th>Actions</th></tr>'+l.map(function(s){return '<tr><td><img class="thumb" alt="" src="'+esc(s.image_url)+'" onerror="this.style.visibility=\'hidden\'"></td><td>'+esc(s.name)+'</td><td>'+priceHTML(s)+'</td><td>'+(s.active?"Shown":"Hidden")+'</td><td class="row2"><button class="btn sm'+(s.popular?"":" ghost")+'" data-p="'+s.id+'">★ Popular</button><button class="btn sm ghost" data-s="'+s.id+'">Sale</button><button class="btn sm ghost" data-e="'+s.id+'">Edit</button><button class="btn sm danger" data-x="'+s.id+'">Delete</button></td></tr>'}).join("")+'</table></div>';
 const f=function(s){q("id").value=s.id||"";q("a").value=s.name||"";q("im").value=s.image_url||"";q("d").value=s.description||"";q("pr").value=s.price==null?"":s.price;q("sp").value=s.sale_price==null?"":s.sale_price;q("du").value=s.duration||60;q("po").checked=!!s.popular;q("ac").checked=s.active!==false;q("pv").hidden=!s.image_url;if(s.image_url)q("pv").src=s.image_url;q("ft").textContent=s.id?"Edit service":"Add a service";scrollTo({top:0,behavior:"smooth"})};
 q("cl").onclick=function(){f({})};
 q("up").onchange=async function(e){const file=e.target.files[0];if(!file)return;q("se").textContent="Uploading photo…";try{const u=await uploadImage(file);q("im").value=u;q("pv").src=u;q("pv").hidden=false;q("se").textContent=""}catch(x){q("se").textContent="Photo upload failed. Check the storage setup."}};
 q("im").oninput=function(){q("pv").hidden=!q("im").value;q("pv").src=q("im").value};
 q("body").onclick=async function(e){const b=e.target.closest("button");if(!b)return;const g=function(k){return l.find(function(s){return s.id==b.dataset[k]})};
  if(b.dataset.e)f(g("e"));
  if(b.dataset.x&&confirm("Delete this service?")){await API.deleteService(b.dataset.x);svcView()}
  if(b.dataset.p){const s=g("p");await API.saveService({id:s.id,popular:!s.popular});svcView()}
  if(b.dataset.s){const s=g("s"),v=prompt("Sale price for "+s.name+" (regular price "+s.price+"). Leave empty to end the sale.",s.sale_price||"");if(v===null)return;if(v!==""&&+v>=+s.price)return alert("The sale price must be lower than the regular price.");await API.saveService({id:s.id,sale_price:v===""?null:+v});svcView()}};
 q("sv").onclick=async function(){if(!q("a").value.trim()||q("pr").value==="")return q("se").textContent="Name and price are required.";
  const sp=q("sp").value===""?null:+q("sp").value;if(sp!==null&&sp>=+q("pr").value)return q("se").textContent="The sale price must be lower than the regular price.";
  const s={name:q("a").value.trim(),image_url:q("im").value.trim(),description:q("d").value.trim(),price:+q("pr").value,sale_price:sp,duration:+q("du").value||60,popular:q("po").checked,active:q("ac").checked};if(q("id").value)s.id=+q("id").value;
  try{await API.saveService(s);svcView()}catch(x){q("se").textContent="Could not save. Check your Supabase login and policies."}}}
start();</script></body></html>
