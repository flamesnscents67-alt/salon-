<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><title>Book an Appointment — Blush &amp; Bloom</title>
<meta name="description" content="Choose your services, date and time and book online."></head><body>
<section><div class="page" id="app"><h1>Book an appointment</h1>
<div class="step"><h2><i>1</i>Choose your services</h2><p class="note">Tap as many as you like.</p><div class="grid" id="svc"></div>
<div class="bar"><span id="sum">Nothing selected yet</span><span class="note" id="dur"></span></div></div>
<div class="step"><h2><i>2</i>Pick a date</h2><input type="date" id="date" aria-label="Date"><p class="note">We are closed on Sundays.</p></div>
<div class="step"><h2><i>3</i>Pick a time</h2><div class="slots" id="slots"><span class="note">Choose a date first.</span></div></div>
<div class="step"><h2><i>4</i>Your details</h2><div class="two"><div><label for="n">Full name</label><input id="n" autocomplete="name"></div><div><label for="p">Phone</label><input id="p" type="tel" autocomplete="tel"></div></div>
<label for="e">Email</label><input id="e" type="email" autocomplete="email"><label for="nt">Notes (optional)</label><textarea id="nt" rows="3"></textarea>
<p class="note" id="err" role="alert" style="color:#b3314f"></p><button class="btn" id="go">Confirm booking</button></div></div></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script><script src="js/config.js"></script><script src="js/app.js"></script>
<script>layout("book.html");
let svcs=[],sel=new Set(),time=null;const $=id=>document.getElementById(id);
const iso=d=>d.toISOString().slice(0,10);
const today=new Date();$("date").min=iso(new Date(today-today.getTimezoneOffset()*6e4));
API.services().then(l=>{svcs=l;$("svc").innerHTML=l.map(s=>cardHTML(s,true)).join("");
 $("svc").onclick=$("svc").onkeydown=e=>{if(e.type==="keydown"&&e.key!==" "&&e.key!=="Enter")return;const c=e.target.closest(".card");if(!c)return;e.preventDefault();
  const id=c.dataset.id;sel.has(id)?sel.delete(id):sel.add(id);c.classList.toggle("sel",sel.has(id));c.setAttribute("aria-checked",sel.has(id));sum()}});
function chosen(){return svcs.filter(s=>sel.has(String(s.id)))}
function sum(){const c=chosen();$("sum").innerHTML=c.length?c.length+" selected · <b>"+money(c.reduce((a,s)=>a+eff(s),0))+"</b>":"Nothing selected yet";$("dur").textContent=c.length?"About "+c.reduce((a,s)=>a+s.duration,0)+" min":""}
$("date").onchange=async()=>{time=null;const d=$("date").value;if(!d)return;const day=new Date(d+"T00:00").getDay();
 if(C.closedDays.includes(day)){$("slots").innerHTML='<span class="note">We are closed that day. Please pick another.</span>';return}
 const taken=await API.taken(d);let h="";for(let t=C.openHour;t<=C.closeHour;t++){const v=String(t).padStart(2,"0")+":00";const lab=(t%12||12)+":00 "+(t<12?"am":"pm");
  h+='<button type="button" class="slot" data-t="'+v+'" '+(taken.includes(v)?"disabled":"")+'>'+lab+'</button>'}
 $("slots").innerHTML=h;$("slots").onclick=e=>{const b=e.target.closest(".slot");if(!b||b.disabled)return;time=b.dataset.t;document.querySelectorAll(".slot").forEach(x=>x.classList.toggle("on",x===b))}};
$("go").onclick=async()=>{const c=chosen(),err=$("err");err.textContent="";
 if(!c.length)return err.textContent="Please choose at least one service.";if(!$("date").value)return err.textContent="Please pick a date.";if(!time)return err.textContent="Please pick a time.";
 if(!$("n").value.trim()||!$("p").value.trim()||!/.+@.+\..+/.test($("e").value))return err.textContent="Please enter your name, phone and a valid email.";
 $("go").disabled=true;try{await API.book({name:$("n").value.trim(),email:$("e").value.trim(),phone:$("p").value.trim(),notes:$("nt").value.trim(),date:$("date").value,time,
  services:c.map(s=>s.name),service_ids:c.map(s=>s.id),total:c.reduce((a,s)=>a+eff(s),0)});
  $("app").innerHTML='<div class="ok"><h2>You are booked in!</h2><p>'+esc($("date").value)+' at '+time+'. We will confirm by phone or email.</p><a class="btn" href="index.html">Back home</a></div>'}
 catch(x){err.textContent="That did not go through. Please try again or pick another time.";$("go").disabled=false}};</script></body></html>
